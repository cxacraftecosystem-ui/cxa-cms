<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Centre of Excellence">
  <!--
    The institutional mark: an eight-point terracotta star with a near-black core, on cream.

    Taken verbatim from the Centre's existing mark in the Portal_Development_Web project
    (frontend/app/icon.svg and components/FieldRepoLogo.tsx, itself the Android launcher icon at
    android/app/src/main/res/drawable/ic_launcher.xml), so the two properties carry one identity
    rather than two. The 108-unit box and the 24-unit corner radius are that file's, not a redraw.

    ⚠ THESE THREE COLOURS ARE BRAND-NATIVE AND NEVER RE-THEME. A logo that changed colour with a
    preference would not be a logo. The cream tile is kept on dark surfaces too — the star is
    terracotta and would lose most of its contrast floated directly on the site's purple-950.

    Mirrored in two other places, and all three must move together:
      • app/apple-icon.tsx — iOS ignores SVG favicons and needs a generated PNG.
      • components/site/SiteBrand.tsx — the header and footer mark, inline so it can take classes.
  -->
  <rect width="108" height="108" rx="24" fill="#FAF9F5"/>
  <path d="M54 14l7 27 27-7-20 20 20 20-27-7-7 27-7-27-27 7 20-20-20-20 27 7z" fill="#CC785C"/>
  <circle cx="54" cy="54" r="15" fill="#181715"/>
</svg>
