<rect x="6" y="6" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k0)"><circle cx="358.7" cy="26" r="120" fill="url(#halo)"/><rect x="6" y="6" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:0s" x="-174" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="30" y="30" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(42 42) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="364.7" y="52" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">PUBLIC SITE</text>
<text x="30" y="116" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">A living archive</text>
<text x="30" y="146" class="s" fill="#9E98B2" font-size="15">Research, people, projects,</text><text x="30" y="169" class="s" fill="#9E98B2" font-size="15">publications, news, events and crafts,</text><text x="30" y="192" class="s" fill="#9E98B2" font-size="15">prerendered, cinematic and fast.</text>
</g>
<g class="rise r1">
<rect x="408.7" y="6" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k1)"><circle cx="761.3" cy="26" r="120" fill="url(#halo)"/><rect x="408.7" y="6" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:0.7s" x="228.7" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="432.7" y="30" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(444.7 42) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></g>
<text x="767.3" y="52" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">STUDIO</text>
<text x="432.7" y="116" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">The invisible CMS</text>
<text x="432.7" y="146" class="s" fill="#9E98B2" font-size="15">No link points to it. Editors reach</text><text x="432.7" y="169" class="s" fill="#9E98B2" font-size="15">/studio by address, a shortcut or seven</text><text x="432.7" y="192" class="s" fill="#9E98B2" font-size="15">clicks on the footer mark.</text>
</g>
<g class="rise r2">
<rect x="811.3" y="6" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k2)"><circle cx="1164" cy="26" r="120" fill="url(#halo)"/><rect x="811.3" y="6" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:1.4s" x="631.3" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="30" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(847.3 42) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g>
<text x="1170" y="52" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">SECTIONS</text>
<text x="835.3" y="116" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Typed blocks, no migrations</text>
<text x="835.3" y="146" class="s" fill="#9E98B2" font-size="15">A page is ordered, typed sections. A new</text><text x="835.3" y="169" class="s" fill="#9E98B2" font-size="15">block is a schema, a renderer and an</text><text x="835.3" y="192" class="s" fill="#9E98B2" font-size="15">editor form.</text>
</g>
<g class="rise r3">
<rect x="6" y="240" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k3)"><circle cx="358.7" cy="260" r="120" fill="url(#halo)"/><rect x="6" y="240" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:2.1s" x="-174" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="30" y="264" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(42 276) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g>
<text x="364.7" y="286" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">PUBLISHING</text>
<text x="30" y="350" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Resolved at read time</text>
<text x="30" y="380" class="s" fill="#9E98B2" font-size="15">Draft, review, schedule, publish,</text><text x="30" y="403" class="s" fill="#9E98B2" font-size="15">archive. The read filters decide what is</text><text x="30" y="426" class="s" fill="#9E98B2" font-size="15">live, so a late cron leaks nothing.</text>
</g>
<g class="rise r4">
<rect x="408.7" y="240" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k4)"><circle cx="761.3" cy="260" r="120" fill="url(#halo)"/><rect x="408.7" y="240" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:2.8s" x="228.7" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="432.7" y="264" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(444.7 276) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></g>
<text x="767.3" y="286" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">MEDIA</text>
<text x="432.7" y="350" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Straight to storage</text>
<text x="432.7" y="380" class="s" fill="#9E98B2" font-size="15">Signed uploads skip the server,</text><text x="432.7" y="403" class="s" fill="#9E98B2" font-size="15">derivatives are made once, and every</text><text x="432.7" y="426" class="s" fill="#9E98B2" font-size="15">picture is framed per screen size.</text>
</g>
<g class="rise r5">
<rect x="811.3" y="240" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k5)"><circle cx="1164" cy="260" r="120" fill="url(#halo)"/><rect x="811.3" y="240" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:3.5s" x="631.3" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="264" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(847.3 276) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="1170" y="286" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">ACCESS</text>
<text x="835.3" y="350" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">An access list first</text>
<text x="835.3" y="380" class="s" fill="#9E98B2" font-size="15">Password, Google, Microsoft or Yahoo</text><text x="835.3" y="403" class="s" fill="#9E98B2" font-size="15">proves who you are; the master admin's</text><text x="835.3" y="426" class="s" fill="#9E98B2" font-size="15">list decides if you get in.</text>
</g>
<g class="rise r6">
<rect x="6" y="474" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k6)"><circle cx="358.7" cy="494" r="120" fill="url(#halo)"/><rect x="6" y="474" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:4.2s" x="-174" y="474" width="180" height="3" fill="url(#glint)"/></g>
<rect x="30" y="498" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(42 510) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></g>
<text x="364.7" y="520" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">AUDIT</text>
<text x="30" y="584" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Every write, with its trail</text>
<text x="30" y="614" class="s" fill="#9E98B2" font-size="15">The row, its revision and its audit</text><text x="30" y="637" class="s" fill="#9E98B2" font-size="15">entry commit together. Nothing an editor</text><text x="30" y="660" class="s" fill="#9E98B2" font-size="15">deletes is lost.</text>
</g>
<g class="rise r7">
<rect x="408.7" y="474" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k7)"><circle cx="761.3" cy="494" r="120" fill="url(#halo)"/><rect x="408.7" y="474" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:4.9s" x="228.7" y="474" width="180" height="3" fill="url(#glint)"/></g>
<rect x="432.7" y="498" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(444.7 510) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g>
<text x="767.3" y="520" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">NEWSLETTER</text>
<text x="432.7" y="584" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Composed in the studio</text>
<text x="432.7" y="614" class="s" fill="#9E98B2" font-size="15">Issues are written in the studio and</text><text x="432.7" y="637" class="s" fill="#9E98B2" font-size="15">sent through Amazon SES from an outbox</text><text x="432.7" y="660" class="s" fill="#9E98B2" font-size="15">drained on a schedule.</text>
</g>
<g class="rise r8">
<rect x="811.3" y="474" width="382.7" height="214" rx="18" fill="#1A1725" stroke="#342E47"/>
<g clip-path="url(#k8)"><circle cx="1164" cy="494" r="120" fill="url(#halo)"/><rect x="811.3" y="474" width="382.7" height="3" fill="#5F1C93"/><rect class="shine" style="animation-delay:5.6s" x="631.3" y="474" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="498" width="48" height="48" rx="14" fill="#2F0D4B" stroke="#5F1C93"/>
<g transform="translate(847.3 510) scale(1)" fill="none" stroke="#D6B6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g>
<text x="1170" y="520" class="m" fill="#9E98B2" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">VERIFICATION</text>
<text x="835.3" y="584" class="d" fill="#F2F0F9" font-size="20" font-weight="700" letter-spacing="-.3">Four layers in CI</text>
<text x="835.3" y="614" class="s" fill="#9E98B2" font-size="15">Types and lint, route-check, a signed-in</text><text x="835.3" y="637" class="s" fill="#9E98B2" font-size="15">smoke run and a leak check that hunts</text><text x="835.3" y="660" class="s" fill="#9E98B2" font-size="15">drafts on the public site.</text>
</g>
</svg>
